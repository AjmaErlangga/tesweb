<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse & Manifest - DLV WMS</title>
  
  <!-- Memanggil Tailwind CSS untuk Desain -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Memanggil Ikon Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PENTING: Memanggil Library Scanner QR Code Kamera Asli -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <!-- PENTING: Library untuk cetak PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <!-- PENTING: Library untuk Grafik Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Meta tag untuk PWA (Bisa di-Install ke HP) -->
  <link id="pwa-manifest" rel="manifest" href="">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DLV WMS">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2933/2933886.png">

  <!-- CSS Tambahan -->
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .hidden-el { display: none !important; }
    
    /* Scrollbar minimalis untuk tabel di HP */
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    /* Memperbaiki tampilan default kamera agar melengkung rapi */
    #qr-reader { border: none !important; border-radius: 12px; overflow: hidden; background-color: #111827; }
    #qr-reader video { object-fit: cover; border-radius: 12px; }

    /* Animasi Laser Scanner */
    @keyframes scanline {
        0% { transform: translateY(-90px); }
        100% { transform: translateY(90px); }
    }
    .animate-scanline { animation: scanline 2s ease-in-out infinite alternate; }

    /* KHUSUS MODE CETAK (PRINT) MANIFEST */
    @media print {
        @page { margin: 1cm; size: auto; }
        body { 
            background-color: white !important; 
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        /* Sembunyikan elemen UI yang tidak perlu saat cetak */
        #sidebar, header, #mobile-overlay, .no-print, #toast-container, #modal-container { 
            display: none !important; 
        }
        /* Bebaskan pembatas ukuran */
        #app-wrapper, #main-content { 
            display: block !important; 
            height: auto !important; 
            overflow: visible !important; 
            padding: 0 !important; 
            margin: 0 !important;
            background: white !important;
        }
        .main-card { 
            box-shadow: none !important; 
            border: none !important; 
            border-radius: 0 !important;
            max-width: 100% !important; 
            width: 100% !important;
        }
        .signature-area { background-color: white !important; border-top: 1px solid #e5e7eb !important; color: black !important; }
        input, select { color: black !important; border: none; background: transparent; padding: 0; }
        input::placeholder { color: transparent !important; opacity: 0 !important; visibility: hidden !important; }
    }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 h-screen w-full overflow-hidden flex">

  <!-- ================= LAYAR LOGIN ================= -->
  <div id="login-view" class="fixed inset-0 z-[100] bg-gray-100 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-sm overflow-hidden animate-fade-in border border-gray-200">
      <div class="bg-gradient-to-br from-gray-900 to-blue-900 p-8 text-center text-white">
        <div class="w-16 h-16 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center mx-auto mb-4">
          <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
        </div>
        <h1 class="font-black text-3xl tracking-wide">DLV<span class="text-blue-400">WMS</span></h1>
        <p class="text-gray-300 text-sm mt-2">Masuk untuk mengelola gudang</p>
      </div>
      <div class="p-8 space-y-5">
        <div id="login-error" class="hidden-el bg-red-50 text-red-600 p-3 rounded-xl text-sm font-medium border border-red-100 text-center">
          Username atau Password salah!
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Username</label>
          <input id="login-username" type="text" onkeydown="if(event.key === 'Enter') processLogin()" class="w-full border border-gray-300 rounded-xl p-3 bg-gray-50 focus:bg-white focus:border-blue-500 outline-none transition-colors" placeholder="Masukkan username..." autocomplete="off">
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Password</label>
          <div class="relative flex items-center">
            <input id="login-password" type="password" onkeydown="if(event.key === 'Enter') processLogin()" class="w-full border border-gray-300 rounded-xl p-3 pr-10 bg-gray-50 focus:bg-white focus:border-blue-500 outline-none transition-colors" placeholder="••••••••">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 text-gray-400 hover:text-gray-600 focus:outline-none">
              <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
        <button id="btn-login" onclick="processLogin()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-colors flex justify-center items-center gap-2 mt-2">
          <i data-lucide="log-in" class="w-5 h-5"></i> Masuk Sistem
        </button>
      </div>
    </div>
  </div>

  <!-- ================= 1. HALAMAN UTAMA APLIKASI (ADMIN) ================= -->
  <div id="app-wrapper" class="hidden-el flex w-full h-full relative">
    
    <!-- Overlay Mobile untuk Sidebar -->
    <div id="mobile-overlay" onclick="toggleSidebar()" class="hidden-el fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-30 md:hidden"></div>

    <!-- SIDEBAR -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-gray-900 text-white transition-all duration-300 flex flex-col shadow-2xl border-r border-gray-800 transform -translate-x-full md:relative md:translate-x-0">
      <div class="h-16 flex items-center justify-center border-b border-gray-800 bg-gray-950 px-4">
        <h1 id="sidebar-title" class="font-black text-xl tracking-wide truncate w-full text-center">
          DLV<span class="text-blue-500">WMS</span>
        </h1>
        <i data-lucide="package" id="sidebar-icon" class="text-blue-500 hidden-el w-7 h-7 flex-shrink-0"></i>
      </div>
      
      <!-- Info User Login -->
      <div class="p-4 border-b border-gray-800 bg-gray-900/50 flex flex-col items-center">
        <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center mb-2 font-bold text-white shadow-inner">
          <span id="user-avatar">A</span>
        </div>
        <div id="sidebar-user-info" class="text-center w-full transition-opacity">
          <p id="current-username" class="font-bold text-sm truncate">AJMA</p>
          <p id="current-role" class="text-xs text-blue-400 font-medium">Super Admin</p>
        </div>
      </div>

      <nav class="flex-1 mt-4 space-y-2 p-3 overflow-y-auto">
        <button onclick="navigate('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 p-3.5 rounded-xl font-medium transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
          <i data-lucide="home" class="w-5 h-5 flex-shrink-0"></i> <span class="nav-text truncate">Dashboard</span>
        </button>
        <button onclick="navigate('warehouse')" id="nav-warehouse" class="w-full flex items-center gap-3 p-3.5 rounded-xl font-medium transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
          <i data-lucide="package" class="w-5 h-5 flex-shrink-0"></i> <span class="nav-text truncate">Manajemen Gudang</span>
        </button>
        <!-- MENU: MANIFEST / SERAH TERIMA -->
        <button onclick="navigate('manifest')" id="nav-manifest" class="w-full flex items-center gap-3 p-3.5 rounded-xl font-medium transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
          <i data-lucide="clipboard-check" class="w-5 h-5 flex-shrink-0"></i> <span class="nav-text truncate">Serah Terima</span>
        </button>
        <button onclick="navigate('history')" id="nav-history" class="w-full flex items-center gap-3 p-3.5 rounded-xl font-medium transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
          <i data-lucide="history" class="w-5 h-5 flex-shrink-0"></i> <span class="nav-text truncate">Riwayat (Log)</span>
        </button>
        <!-- Menu Manajemen User (Hanya tampil jika Super Admin) -->
        <button onclick="navigate('users')" id="nav-users" class="hidden-el w-full flex items-center gap-3 p-3.5 rounded-xl font-medium transition-all text-emerald-400 hover:bg-gray-800 hover:text-emerald-300">
          <i data-lucide="users" class="w-5 h-5 flex-shrink-0"></i> <span class="nav-text truncate">Manajemen User</span>
        </button>

        <!-- Tombol Install PWA -->
        <button onclick="installPWA()" id="install-app-btn" class="hidden-el w-full flex items-center gap-3 p-3.5 rounded-xl font-medium transition-all text-amber-400 hover:bg-gray-800 hover:text-amber-300 border border-gray-800 mt-2 bg-amber-500/10">
          <i data-lucide="download" class="w-5 h-5 flex-shrink-0"></i> <span class="nav-text truncate">Install Aplikasi</span>
        </button>
      </nav>

      <!-- Logout Sidebar -->
      <div class="p-3 border-t border-gray-800">
         <button onclick="processLogout()" class="w-full flex items-center justify-center gap-2 p-3 rounded-xl font-bold transition-all text-red-400 hover:bg-red-500/10">
          <i data-lucide="log-out" class="w-5 h-5"></i> <span class="nav-text">Keluar</span>
        </button>
      </div>
    </div>

    <!-- AREA KONTEN UTAMA -->
    <div class="flex-1 flex flex-col transition-all duration-300 min-w-0 h-full">
      <!-- Header -->
      <header class="h-16 bg-white/90 backdrop-blur-md shadow-sm border-b border-gray-100 flex items-center justify-between px-4 md:px-6 flex-shrink-0 z-10 print:hidden">
        <div class="flex items-center gap-3">
          <button onclick="toggleSidebar()" class="p-2 -ml-2 rounded-xl hover:bg-gray-100 text-gray-600 transition-colors">
            <i data-lucide="menu" class="w-6 h-6"></i>
          </button>
          <span class="font-bold text-gray-800 md:hidden">DLV WMS</span>
        </div>
        
        <div class="flex items-center gap-2 text-xs md:text-sm font-semibold text-gray-600 bg-white shadow-sm px-3 md:px-4 py-1.5 rounded-full border border-gray-100">
          <span id="sync-indicator" class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse flex-shrink-0"></span> 
          <span id="sync-text" class="hidden sm:inline">Sistem Aktif</span>
          <button onclick="refreshDatabase()" class="ml-1 md:ml-2 text-blue-500 hover:text-blue-700 p-1" title="Tarik Data Terbaru dari Server">
            <i data-lucide="download-cloud" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <!-- Tempat Merender Konten Utama -->
      <main id="main-content" class="p-4 md:p-8 flex-1 overflow-y-auto overflow-x-hidden bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:16px_16px] print:p-0 print:bg-white">
        <!-- Konten diinjeksi via JS -->
      </main>
    </div>
  </div>

  <!-- ================= 2. HALAMAN PUBLIK (HASIL SCAN ANONIM) ================= -->
  <div id="public-scan-view" class="hidden-el w-full h-full bg-gray-100 overflow-y-auto">
    <div class="max-w-2xl mx-auto p-4 md:p-8 min-h-screen flex flex-col">
      <!-- Header Publik -->
      <div class="flex flex-col items-center justify-center mb-8 mt-4">
        <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg mb-4 text-white">
          <i data-lucide="box" class="w-8 h-8"></i>
        </div>
        <h1 class="font-black text-2xl tracking-wide text-gray-900">DLV<span class="text-blue-600">WMS</span></h1>
        <p class="text-gray-500 text-sm mt-1">Informasi Pemindaian Barang</p>
      </div>

      <!-- Konten Scan Publik -->
      <div id="public-scan-content" class="flex-1">
        <div class="text-center p-10 bg-white rounded-3xl shadow-sm border border-gray-200">
          <i data-lucide="loader-2" class="w-10 h-10 text-blue-500 animate-spin mx-auto mb-4"></i>

        </div>
      </div>
      
      <!-- Footer Publik -->
      <div class="mt-8 text-center text-xs text-gray-400 pb-8">
        &copy; 2026 Sistem Manajemen Gudang DLV. Tidak ada otorisasi edit.
      </div>
    </div>
  </div>

  <!-- ================= MODAL / POPUP ================= -->
  <div id="modal-container" class="hidden-el fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in print:hidden">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all border border-gray-100 flex flex-col max-h-[90vh]">
      <div class="flex justify-between items-center p-4 md:p-5 border-b border-gray-100 bg-gray-50/50">
        <h3 id="modal-title" class="font-bold text-base md:text-lg text-gray-800 flex items-center gap-2">Judul Modal</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 transition-colors bg-white rounded-full p-1 shadow-sm">
          <i data-lucide="x-circle" class="w-6 h-6"></i>
        </button>
      </div>
      <div id="modal-body" class="overflow-y-auto flex-1 custom-scrollbar"></div>
      <div id="modal-footer" class="p-4 bg-gray-50 border-t border-gray-100 flex flex-col sm:flex-row justify-end gap-2 sm:gap-3 hidden-el">
        <button onclick="closeModal()" class="w-full sm:w-auto px-5 py-2.5 text-sm font-bold text-gray-600 bg-white border border-gray-300 rounded-xl hover:bg-gray-100 transition-colors">Batal</button>
        <button id="modal-save-btn" onclick="saveModalData()" class="w-full sm:w-auto px-5 py-2.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
          <i data-lucide="check-circle-2" class="w-4 h-4"></i> Simpan Data
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-container" class="fixed bottom-4 right-4 md:bottom-8 md:right-8 z-[60] flex flex-col gap-2 w-[calc(100%-2rem)] md:w-auto pointer-events-none print:hidden"></div>

  <!-- ================= LOGIKA JAVASCRIPT UTAMA ================= -->
  <script>
    // URL GOOGLE APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6zqBOoOIrzDb6XmRfztEkqpT2okGyY0JCZv7PRjZf_NCqytKBkNRzu9RYBrQCIMqqFA/exec"; 

    // --- VARIABEL GLOBAL ---
    let currentDbVersion = 1;
    let usersDataList = []; 

    // --- FUNGSI SANITASI (MENCEGAH XSS HACKING) ---
    function sanitizeHTML(str) {
        if (!str) return '';
        const temp = document.createElement('div');
        temp.textContent = str;
        return temp.innerHTML;
    }

    // --- FUNGSI PEMBERSIH URL GOOGLE DRIVE (AUTO-FIX) ---
    function getSafeDriveUrl(rawUrl, isImageTag = false) {
      if (!rawUrl) return '';
      let fileId = '';
      
      if (rawUrl.includes('](')) fileId = rawUrl.split(')')[1]; 
      else if (rawUrl.includes('id=')) fileId = rawUrl.split('id=')[1].split('&')[0];
      else if (rawUrl.includes('/d/')) fileId = rawUrl.split('/d/')[1].split('/')[0];
      else return rawUrl;
      
      if (isImageTag) return `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
      return `https://drive.google.com/file/d/${fileId}/view`;
    }

    // --- STATE UTAMA ---
    let activeMenu = 'warehouse';
    let isSidebarOpen = window.innerWidth >= 768; 
    let expandedPallets = {};
    let expandedBoxes = {};
    let modalState = { type: '', parentId: null, parentBoxId: null, itemData: null, parentName: '' };
    
    // Objek Kamera & Session
    let html5QrCode = null; 
    let currentUser = null;

    // Data Dasar Gudang
    let warehouseData = [];
    let historyLog = [];
    
    // State untuk Serah Terima (Manifest)
    let manifestHistory = []; 
    let currentManifestDraft = []; 
    let isManifestSaved = false;
    let currentManifestId = "DRAFT (BELUM DISIMPAN)";
    let manifestFormState = { sender: '', receiver: '' }; 

    // Variabel untuk PWA & Chart
    let deferredPrompt;
    let stockChartInstance = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('install-app-btn');
      if(installBtn) installBtn.classList.remove('hidden-el');
    });

    window.installPWA = async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('install-app-btn').classList.add('hidden-el');
        }
        deferredPrompt = null;
      }
    };

    function saveDraftToLocal() {
      localStorage.setItem('dlv_manifest_draft', JSON.stringify({
        items: currentManifestDraft,
        id: currentManifestId,
        state: manifestFormState
      }));
    }

    function loadDraftFromLocal() {
      try {
        const saved = localStorage.getItem('dlv_manifest_draft');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed.items && parsed.items.length > 0) {
            currentManifestDraft = parsed.items;
            currentManifestId = parsed.id || "DRAFT (BELUM DISIMPAN)";
            manifestFormState = parsed.state || { sender: '', receiver: '' };
          }
        }
      } catch(e) {}
    }

    window.onload = async () => {
      lucide.createIcons();
      loadDraftFromLocal(); 
      
      try {
        const manifest = {
          name: "DLV Warehouse System",
          short_name: "DLV WMS",
          start_url: window.location.href.split('?')[0],
          display: "standalone",
          background_color: "#f9fafb",
          theme_color: "#2563eb",
          icons: [{ src: "https://cdn-icons-png.flaticon.com/512/2933/2933886.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }]
        };
        const blobManifest = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(blobManifest));
        
        const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => e.waitUntil(clients.claim())); self.addEventListener('fetch', e => {});`;
        const blobSW = new Blob([swCode], {type: 'application/javascript'});
        if ('serviceWorker' in navigator) navigator.serviceWorker.register(URL.createObjectURL(blobSW)).catch(e=>{});
      } catch(e) {}

      const urlParams = new URLSearchParams(window.location.search);
      const scanId = urlParams.get('scan');
      
      if (scanId) {
        document.getElementById('login-view').classList.add('hidden-el');
        document.getElementById('app-wrapper').classList.add('hidden-el');
        document.getElementById('public-scan-view').classList.remove('hidden-el');
        
        if (SCRIPT_URL) await fetchDatabaseForPublic(scanId);
        else renderPublicScanError("Database tidak terhubung.");
      } else {
        if (SCRIPT_URL) await fetchDatabase();
        
        const savedSession = sessionStorage.getItem('loggedInUser');
        if (savedSession) {
           try {
             const validUser = JSON.parse(savedSession);
             if (validUser && validUser.username) {
                applyLogin(validUser);
             } else {
                sessionStorage.removeItem('loggedInUser');
             }
           } catch(e) {
             sessionStorage.removeItem('loggedInUser');
           }
        }
        
        if(window.innerWidth < 768) {
           document.getElementById('sidebar').classList.add('-translate-x-full');
        }
      }
    };

    function togglePasswordVisibility() {
      const passInput = document.getElementById('login-password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        passInput.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    async function processLogin() {
       const userInp = document.getElementById('login-username').value.trim().toUpperCase();
       const passInp = document.getElementById('login-password').value.trim();
       const errBox = document.getElementById('login-error');
       const btn = document.getElementById('btn-login');
       
       if (!userInp || !passInp) {
          errBox.innerText = "Username dan Password wajib diisi!";
          errBox.classList.remove('hidden-el');
          return;
       }

       errBox.classList.add('hidden-el');
       const originalBtnText = btn.innerHTML;
       btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Memeriksa...`;
       btn.disabled = true;
       lucide.createIcons();

       try {
           const payload = {
               action: 'login',
               username: userInp,
               password: passInp
           };
           const response = await fetch(SCRIPT_URL, {
               method: 'POST',
               body: JSON.stringify(payload)
           });
           const result = await response.json();

           if (result.status === 'success') {
               result.user.password = passInp;
               sessionStorage.setItem('loggedInUser', JSON.stringify(result.user));
               applyLogin(result.user);
           } else {
               errBox.innerText = result.message || "Username atau Password salah!";
               errBox.classList.remove('hidden-el');
           }
       } catch (e) {
           errBox.innerText = "Terjadi kesalahan jaringan saat login.";
           errBox.classList.remove('hidden-el');
       } finally {
           btn.innerHTML = originalBtnText;
           btn.disabled = false;
           lucide.createIcons();
       }
    }

    function applyLogin(userObj) {
       currentUser = userObj;
       document.getElementById('current-username').innerText = sanitizeHTML(currentUser.username);
       document.getElementById('user-avatar').innerText = sanitizeHTML(currentUser.username.charAt(0).toUpperCase());
       document.getElementById('current-role').innerText = sanitizeHTML(currentUser.role);
       
       const navUsers = document.getElementById('nav-users');
       if (currentUser.role === 'Super Admin') navUsers.classList.remove('hidden-el');
       else {
          navUsers.classList.add('hidden-el');
          if (activeMenu === 'users') activeMenu = 'warehouse';
       }

       document.getElementById('login-view').classList.add('hidden-el');
       document.getElementById('app-wrapper').classList.remove('hidden-el');
       navigate(activeMenu);
    }

    function processLogout() {
       sessionStorage.removeItem('loggedInUser');
       currentUser = null;
       document.getElementById('login-username').value = '';
       document.getElementById('login-password').value = '';
       document.getElementById('login-error').classList.add('hidden-el');

       document.getElementById('app-wrapper').classList.add('hidden-el');
       document.getElementById('login-view').classList.remove('hidden-el');
    }

    async function fetchDatabaseForPublic(boxId) {
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

    async function fetchDatabase() {
      setSyncStatus('Memuat...', 'bg-yellow-500');
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        if(data) {
          currentDbVersion = data.dbVersion || 1; 
          
          warehouseData = data.warehouseData || [];
          historyLog = data.historyLog || [];
          manifestHistory = data.manifestHistory || []; 
          
          setSyncStatus('Sistem Aktif', 'bg-emerald-500');
          if(currentUser) navigate(activeMenu, true); 
        }
      } catch (err) {
        setSyncStatus('Mode Offline', 'bg-red-500');
      }
    }

    async function syncToDatabase() {
      if (!SCRIPT_URL) return;
      setSyncStatus('Menyimpan...', 'bg-yellow-500');
      try {
        const payload = {
            dbVersion: currentDbVersion,
            warehouseData: warehouseData,
            historyLog: historyLog,
            manifestHistory: manifestHistory
        };

        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === 'conflict') {
            alert("⚠️ " + result.message);
            fetchDatabase(); 
            setSyncStatus('Konflik Data', 'bg-red-500');
        } else if (result.status === 'success') {
            currentDbVersion = result.newDbVersion; 
            setSyncStatus('Sistem Aktif', 'bg-emerald-500');
        }
      } catch (err) {
        setSyncStatus('Gagal Simpan', 'bg-red-500');
      }
    }

    function setSyncStatus(text, colorClass) {
      document.getElementById('sync-text').innerText = text;
      document.getElementById('sync-indicator').className = `w-2.5 h-2.5 rounded-full animate-pulse flex-shrink-0 ${colorClass}`;
    }

    function showToast(message, type = 'error') {
      const toast = document.createElement('div');
      const bgColor = type === 'error' ? 'bg-red-600' : 'bg-emerald-600';
      toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-3 text-sm font-medium w-full pointer-events-auto z-[999]`;
      toast.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-5 h-5 flex-shrink-0"></i> <span>${message}</span>`;
      
      document.getElementById('toast-container').appendChild(toast);
      lucide.createIcons();
      
      requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
      setTimeout(() => {

        setTimeout(() => toast.remove(), 300);

    function startScanner() {
      html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
        (decodedText) => {
          let scanId = null;
          try {
             const url = new URL(decodedText);
             scanId = url.searchParams.get('scan');
          } catch(e) { scanId = decodedText; }

          if (scanId) {
             let foundBox = null, foundPallet = null;
             for (const p of warehouseData) {
               const b = p.boxes.find(x => x.id === scanId);
               if (b) { foundBox = b; foundPallet = p; break; }
             }
             if(foundBox) {
                stopScanner();
                openModal('ScanResult', foundPallet.id, foundBox.id);
             } else {
                showToast("Box tidak ditemukan di database gudang!", "error");
             }
          } else {
             showToast("Format QR Code tidak dikenali.", "error");
          }
        },
        (errorMessage) => {}
      ).catch((err) => {
        showToast("Kamera ditolak atau tidak ditemukan.", "error");
      });
    }

    function startResiScanner() {
      html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 80 }, aspectRatio: 1.0 },
        (decodedText) => {
          stopScanner(); closeModal();
          const resi = decodedText.trim().toUpperCase();
          const service = document.getElementById('serviceInput') ? document.getElementById('serviceInput').value : 'REG';
          
          if(currentManifestDraft.some(i => i.resi === resi)) {
              showToast("Resi duplikat diabaikan.", "error");
          } else {
              currentManifestDraft.push({ id: Date.now(), waktu: new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}), resi: resi, service: service });
              renderManifestTable();
              showToast("Resi berhasil ditambahkan!", "success");
          }
        }, (errorMessage) => {}
      ).catch((err) => showToast("Kamera error/tidak diizinkan.", "error"));
    }

    function stopScanner() {
      if (html5QrCode) {
        try {
          html5QrCode.stop().then(() => {
            html5QrCode.clear();
            html5QrCode = null;
          }).catch(err => { console.error(err); });
        } catch(e) { console.error(e); }
      }
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobile-overlay');
      const texts = document.querySelectorAll('.nav-text');
      const title = document.getElementById('sidebar-title');
      const icon = document.getElementById('sidebar-icon');
      const userInfo = document.getElementById('sidebar-user-info');
      const isMobile = window.innerWidth < 768;

      if (isMobile) {
        if (sidebar.classList.contains('-translate-x-full')) {
          sidebar.classList.remove('-translate-x-full');
          overlay.classList.remove('hidden-el');
        } else {
          sidebar.classList.add('-translate-x-full');
          overlay.classList.add('hidden-el');
        }
      } else {
        isSidebarOpen = !isSidebarOpen;
        if (isSidebarOpen) {
          sidebar.classList.remove('w-20'); sidebar.classList.add('w-64');
          texts.forEach(t => t.classList.remove('hidden-el'));
          title.classList.remove('hidden-el');
          icon.classList.add('hidden-el');
          userInfo.classList.remove('hidden-el');
        } else {
          sidebar.classList.remove('w-64'); sidebar.classList.add('w-20');
          texts.forEach(t => t.classList.add('hidden-el'));
          title.classList.add('hidden-el');
          icon.classList.remove('hidden-el');
          userInfo.classList.add('hidden-el');
        }
      }
    }

        if(m === menu) {
          const colorClass = m === 'users' ? 'emerald' : m === 'manifest' ? 'indigo' : 'blue';
          btn.className = `w-full flex items-center gap-3 p-3.5 rounded-xl font-medium transition-all bg-${colorClass}-600 text-white shadow-lg shadow-${colorClass}-900/50`;

      else if (menu === 'manifest') {

      else if (menu === 'users') {
         main.innerHTML = renderUsersMenu(noAnimation);

      }

            let total = 0;
            p.boxes.forEach(b => b.items.forEach(i => total += (parseInt(i.qty) || 0)));
            return total;
        });

        stockChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Total Stok (Pcs)',
                    data: dataPcs,
                    backgroundColor: 'rgba(37, 99, 235, 0.8)',
                    borderColor: 'rgba(37, 99, 235, 1)',

                    y: { beginAtZero: true, grid: { borderDash: [2, 4], color: '#f1f5f9' } },
                    x: { grid: { display: false } }
                }
            }
        });
    }

        if (!select || !img || !printText) return;

    window.saveManifestProcess = () => {
        if(currentManifestDraft.length === 0) return showToast("Daftar resi masih kosong!", "error");
        const sender = document.getElementById('manifestSender').value;
        const receiver = document.getElementById('manifestReceiver').value || "-";
        if(!sender) return showToast("Mohon pilih nama Petugas Pengirim!", "error");

        const btnSave = document.getElementById('btnSaveManifest');
        btnSave.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Menyimpan...`;
        btnSave.disabled = true;

        const dateObj = new Date();
        const dateStr = dateObj.toISOString().slice(0,10).replace(/-/g,"");
        const timeStr = dateObj.toTimeString().slice(0,8).replace(/:/g,"");
        currentManifestId = "M" + dateStr + timeStr;

        const newManifest = {
            id: currentManifestId,
            date: dateObj.toLocaleString('id-ID'),
            sender: sender, receiver: receiver, items: currentManifestDraft
        };

        manifestHistory.push(newManifest);
        isManifestSaved = true;

        addLogRecord("BUAT MANIFEST", `Menyimpan ${currentManifestDraft.length} Paket. ID: ${currentManifestId}`, "Serah Terima");

    window.moveBoxOrder = (pId, bId, dir) => {
        const pIdx = warehouseData.findIndex(p => p.id === pId);
        if (pIdx < 0) return;
        const bIdx = warehouseData[pIdx].boxes.findIndex(b => b.id === bId);
        if (bIdx < 0) return;
        
        const newIdx = bIdx + dir;
        if (newIdx < 0 || newIdx >= warehouseData[pIdx].boxes.length) return; 
        
        const temp = warehouseData[pIdx].boxes[bIdx];
        warehouseData[pIdx].boxes[bIdx] = warehouseData[pIdx].boxes[newIdx];
        warehouseData[pIdx].boxes[newIdx] = temp;
        
        navigate('warehouse', true); 
        syncToDatabase();
    };

    window.filterWarehouse = () => {
       const query = document.getElementById('warehouse-search').value.toLowerCase();
       const pallets = document.querySelectorAll('.pallet-container');
       
       pallets.forEach(palEl => {
           let palMatch = palEl.dataset.name.toLowerCase().includes(query);
           let anyBoxMatch = false;
           const boxes = palEl.querySelectorAll('.box-container');
           
           boxes.forEach(boxEl => {
               let boxMatch = boxEl.dataset.name.toLowerCase().includes(query);
               let anyItemMatch = false;
               const items = boxEl.querySelectorAll('.item-row');
               
               items.forEach(itemEl => {
                   let itemMatch = itemEl.dataset.search.toLowerCase().includes(query);
                   if(itemMatch) anyItemMatch = true;
                   itemEl.style.display = itemMatch || boxMatch || palMatch ? '' : 'none';
               });
               
               if (boxMatch || anyItemMatch) anyBoxMatch = true;
               boxEl.style.display = boxMatch || anyItemMatch || palMatch ? '' : 'none';
               
               const content = document.getElementById('box-content-' + boxEl.dataset.id);
               const chevron = document.getElementById('box-chevron-' + boxEl.dataset.id);
               if (content && chevron) {
                  if (query && (boxMatch || anyItemMatch)) {
                     content.classList.remove('hidden-el');
                     chevron.classList.add('rotate-90', 'text-emerald-500');
                  } else if (!query && !expandedBoxes[boxEl.dataset.id]) {
                     content.classList.add('hidden-el');
                     chevron.classList.remove('rotate-90', 'text-emerald-500');
                  }
               }
           });
           
           palEl.style.display = palMatch || anyBoxMatch ? '' : 'none';
           
           const palContent = document.getElementById('pallet-content-' + palEl.dataset.id);
           const palChevron = document.getElementById('pallet-chevron-' + palEl.dataset.id);
           if (palContent && palChevron) {
              if (query && (palMatch || anyBoxMatch)) {
                 palContent.classList.remove('hidden-el');
                 palChevron.classList.add('rotate-90', 'text-blue-500');
              } else if (!query && !expandedPallets[palEl.dataset.id]) {
                 palContent.classList.add('hidden-el');
                 palChevron.classList.remove('rotate-90', 'text-blue-500');
              }
           }
       });
    };

    window.exportWarehouseToPDF = () => {
       if (warehouseData.length === 0) return showToast("Gudang masih kosong, tidak ada data untuk dicetak!", "error");
       
       showToast("Mempersiapkan PDF Data Gudang...", "success");
       const { jsPDF } = window.jspdf;
       const doc = new jsPDF('landscape');
       
       doc.setFontSize(16);
       doc.text("Laporan Stok Barang Gudang - DLV WMS", 14, 20);
       doc.setFontSize(10);
       doc.setTextColor(100);
       doc.text("Dicetak oleh: " + (currentUser ? currentUser.username : "Admin") + " | Waktu: " + new Date().toLocaleString('id-ID'), 14, 28);

       const tableData = [];
       let totalPcs = 0;

       warehouseData.forEach(palet => {
           if (palet.boxes.length === 0) {
               tableData.push([palet.name, "-", "-", "Palet Kosong", "-"]);
           } else {
               palet.boxes.forEach(box => {
                   if (box.items.length === 0) {
                       tableData.push([palet.name, box.name, "-", "Box Kosong", "-"]);
                   } else {
                       box.items.forEach(item => {
                           tableData.push([palet.name, box.name, item.itemCode, item.name, item.qty + " Pcs"]);
                           totalPcs += parseInt(item.qty) || 0;
                       });
                   }
               });
           }
       });

       doc.autoTable({
           startY: 35,
           head: [['Nama Palet', 'Nama Box', 'Kode Barang', 'Nama Artikel', 'Jumlah']],
           body: tableData,
           styles: { fontSize: 9, cellPadding: 3 },
           headStyles: { fillColor: [37, 99, 235] }, 
           alternateRowStyles: { fillColor: [249, 250, 251] },
           foot: [['', '', '', 'TOTAL SELURUH STOK:', totalPcs + ' Pcs']],
           footStyles: { fillColor: [229, 231, 235], textColor: [17, 24, 39], fontStyle: 'bold' }
       });

       doc.save(`DLV_Stok_Barang_${Date.now()}.pdf`);
    };

    async function fetchUsersList() {
      const container = document.getElementById('users-list-container');
      if (!container) return;

      try {
        const payload = {
          action: 'getUsers',
          adminUsername: currentUser.username,
          adminPassword: currentUser.password
        };
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        
        if (result.status === 'success') {
          usersDataList = result.users || [];
          renderUsersTable();
        } else {
          container.innerHTML = `
            <div class="text-center p-8 bg-red-50 text-red-600 rounded-2xl border border-red-200 shadow-sm">
              <i data-lucide="alert-triangle" class="w-8 h-8 mx-auto mb-2"></i>
              Gagal mengambil data user: ${sanitizeHTML(result.message)}
            </div>`;
          lucide.createIcons();
        }
      } catch(e) {
        container.innerHTML = `
          <div class="text-center p-8 bg-red-50 text-red-600 rounded-2xl border border-red-200">
            Terjadi kesalahan koneksi internet atau server backend.
          </div>`;
      }
    }

           preview.src = e.target.result;

      }
    };

    function addLogRecord(action, details, location) {
      const userName = currentUser ? currentUser.username : 'Sistem';
      historyLog.unshift({
        id: 'l' + Date.now(),
        timestamp: new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
        user: userName, action, details, location
      });
    }

    async function saveModalData() {
      const type = modalState.type;
      
      if (type === 'ScanResult') {
        window.history.replaceState({}, document.title, window.location.pathname);
        closeModal();
        navigate('warehouse', true);
        return;
      }
      
      if (type === 'HapusResi') {
        currentManifestDraft = currentManifestDraft.filter(item => item.id !== modalState.itemId);
        renderManifestTable();
        closeModal();
        return;
      }
      
      if (type === 'TambahUser' || type === 'EditUser') {
        const usernameInput = document.getElementById('user-input-username').value.trim().toUpperCase();
        const passwordInput = document.getElementById('user-input-password').value.trim();
        const roleInput = document.getElementById('user-input-role').value;

        if (!usernameInput) return showToast("Username wajib diisi!", "error");
        if (type === 'TambahUser' && !passwordInput) return showToast("Password wajib diisi!", "error");

        const saveBtn = document.getElementById('modal-save-btn');
        saveBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memproses...`;
        saveBtn.disabled = true;
        lucide.createIcons();

        const payload = {
          action: 'saveUser',
          adminUsername: currentUser.username,
          adminPassword: currentUser.password,
          userData: {
            id: type === 'EditUser' ? modalState.itemId : 'u' + Date.now().toString().slice(-6),
            username: usernameInput,
            password: passwordInput,
            role: roleInput
          }
        };

        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          const result = await response.json();

          if (result.status === 'success') {
            showToast("Sukses: Data user disimpan di server!", "success");
            addLogRecord('KELOLA USER', `Berhasil menyimpan/ubah user: ${usernameInput}`, 'Manajemen User');
            closeModal();
            fetchUsersList(); 
          } else {
            showToast("Gagal: " + result.message, "error");
            saveBtn.disabled = false;
            saveBtn.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4"></i> Simpan Perubahan`;
            lucide.createIcons();
          }
        } catch(e) {
          showToast("Kesalahan koneksi saat menyimpan user.", "error");
          saveBtn.disabled = false;
        }
        return;
      }

      if (type === 'HapusUser') {
        const saveBtn = document.getElementById('modal-save-btn');
        saveBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memproses...`;
        saveBtn.disabled = true;
        lucide.createIcons();

        const payload = {
          action: 'deleteUser',
          adminUsername: currentUser.username,
          adminPassword: currentUser.password,
          targetUserId: modalState.itemId
        };

        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          const result = await response.json();

          if (result.status === 'success') {
            showToast("Sukses: Akun berhasil dihapus!", "success");
            addLogRecord('HAPUS USER', `Menghapus salah satu akun petugas`, 'Manajemen User');
            closeModal();
            fetchUsersList(); 
          } else {
            showToast("Gagal menghapus: " + result.message, "error");
            saveBtn.disabled = false;
            saveBtn.innerHTML = `<i data-lucide="trash-2" class="w-4 h-4"></i> Hapus Permanen`;
            lucide.createIcons();
          }
        } catch(e) {

          saveBtn.disabled = false;

      }

      if (type === 'Foto') {
        const pId = modalState.parentId;
        const bId = modalState.parentBoxId;
        const iId = modalState.itemId;
        const itemName = modalState.itemData ? modalState.itemData.name : 'Barang';
        const pName = modalState.parentName;

        const pIdx = warehouseData.findIndex(p => p.id === pId);
        const bIdx = pIdx >= 0 ? warehouseData[pIdx].boxes.findIndex(b => b.id === bId) : -1;
        if (pIdx < 0 || bIdx < 0) return showToast("Lokasi barang tidak valid!", "error");
        
        const itemIdx = warehouseData[pIdx].boxes[bIdx].items.findIndex(i => i.id === iId);
        if (itemIdx < 0) return showToast("Barang tidak ditemukan!", "error");
        
        const targetItem = warehouseData[pIdx].boxes[bIdx].items[itemIdx];

        if (targetItem.photoUrl) {
          targetItem.photoUrl = null;
          addLogRecord('HAPUS FOTO', `Menghapus foto untuk ${itemName}`, pName);
          closeModal();
          navigate('warehouse', true);
          syncToDatabase();
        } else {
          const fileInput = document.getElementById('input-photo-file');
          if (!fileInput.files || fileInput.files.length === 0) return showToast("Pilih foto terlebih dahulu!", "error");
          
          const file = fileInput.files[0];
          const reader = new FileReader();
          const saveBtn = document.getElementById('modal-save-btn');
          
          showToast("Memulai proses upload...", "success");
          saveBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Mengunggah...`;
          saveBtn.disabled = true;
          saveBtn.classList.replace('bg-indigo-600', 'bg-indigo-400'); 
          lucide.createIcons();
          
          reader.onload = function(e) {
             const img = new Image();
             img.onload = async function() {
                const canvas = document.createElement('canvas');
                const MAX_DIM = 800; 
                let width = img.width;
                let height = img.height;

                if (width > height) {
                  if (width > MAX_DIM) { height *= MAX_DIM / width; width = MAX_DIM; }
                } else {
                  if (height > MAX_DIM) { width *= MAX_DIM / height; height = MAX_DIM; }
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);
                
                const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
                const base64Data = dataUrl.split(',')[1];

                try {
                   const response = await fetch(SCRIPT_URL, {
                     method: 'POST',
                     headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                     body: JSON.stringify({ 
                       uploadPhoto: { 
                         fileName: `FOTO_${targetItem.itemCode}_${Date.now()}.jpg`, 
                         mimeType: 'image/jpeg', 
                         base64: base64Data 
                       } 
                     })
                   });
                   const result = await response.json();
                   
                   if (result.status === 'success') {
                      const cP = warehouseData.findIndex(p => p.id === pId);
                      const cB = cP >= 0 ? warehouseData[cP].boxes.findIndex(b => b.id === bId) : -1;
                      const cI = cB >= 0 ? warehouseData[cP].boxes[cB].items.findIndex(i => i.id === iId) : -1;
                      
                      if(cP >= 0 && cB >= 0 && cI >= 0) {
                          warehouseData[cP].boxes[cB].items[cI].photoUrl = result.photoUrl;
                      }

                      addLogRecord('UPLOAD FOTO', `Menambahkan foto untuk ${itemName}`, pName);
                      closeModal();
                      navigate('warehouse', true);
                      syncToDatabase();
                      showToast("🎉 Foto berhasil diunggah!", "success");
                   } else {
                      showToast("Gagal mengunggah: " + result.message, "error");
                      saveBtn.innerHTML = `<i data-lucide="upload-cloud" class="w-4 h-4"></i> Simpan & Upload`;
                      saveBtn.disabled = false;
                      saveBtn.classList.replace('bg-indigo-400', 'bg-indigo-600');
                      lucide.createIcons();
                   }
                } catch (err) {
                   showToast("Terjadi kesalahan koneksi internet.", "error");
                   saveBtn.disabled = false;
                }
             };
             img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }
        return; 
      }

      const pIdx = warehouseData.findIndex(p => p.id === modalState.parentId);
      const bIdx = pIdx >= 0 ? warehouseData[pIdx].boxes.findIndex(b => b.id === modalState.parentBoxId) : -1;
      
      if (type === 'EditBox') {
        const newName = document.getElementById('input-box-name').value.trim();
        if (!newName) return showToast("Nama Box wajib diisi!", "error");
        
        const oldName = warehouseData[pIdx].boxes[bIdx].name;
        warehouseData[pIdx].boxes[bIdx].name = newName;
        addLogRecord('UBAH NAMA BOX', `Mengubah nama box ${oldName} menjadi ${newName}`, warehouseData[pIdx].name);
      }
      else if (type === 'PindahBox') {
        const targetPalletId = document.getElementById('select-target-pallet').value;
        if (!targetPalletId) return showToast("Pilih palet tujuan!", "error");
        
        const tpIdx = warehouseData.findIndex(p => p.id === targetPalletId);
        if (tpIdx < 0) return showToast("Palet tujuan tidak ditemukan!", "error");

        const boxToMove = warehouseData[pIdx].boxes.splice(bIdx, 1)[0];
        warehouseData[tpIdx].boxes.push(boxToMove);
        
        addLogRecord('PINDAH BOX MASSAL', `Memindahkan box ${boxToMove.name}`, `Dari ${warehouseData[pIdx].name} ke ${warehouseData[tpIdx].name}`);
      }
      // UPDATE 3: LOGIKA EDIT ITEM DIHAPUS DARI SINI (KARENA SUDAH PUNYA FUNGSI SENDIRI)
      else if (['Palet', 'Box', 'Barang'].includes(type)) {
        const nameVal = document.getElementById('input-name').value;
        if (!nameVal) return showToast("Nama wajib diisi!", "error");
        
        if (type === 'Palet') {
          warehouseData.push({ id: 'p' + Date.now().toString().slice(-6), name: nameVal, boxes: [] });
          addLogRecord('BUAT PALET', `Membuat direktori ${nameVal}`, 'Gudang Utama');
        } 
        else if (type === 'Box') {
          if(pIdx < 0) return showToast("Pilih Palet terlebih dahulu!", "error");
          warehouseData[pIdx].boxes.push({ id: 'b' + Date.now().toString().slice(-6), name: nameVal, items: [] });
          addLogRecord('BUAT BOX', `Membuat direktori ${nameVal}`, warehouseData[pIdx].name);
        }
        else {
          const codeVal = document.getElementById('input-code').value;
          const qtyVal = parseInt(document.getElementById('input-qty').value) || 0;
          if (!codeVal || qtyVal <= 0) return showToast("Data tidak valid!", "error");
          if (pIdx < 0 || bIdx < 0) return showToast("Lokasi tidak valid!", "error");

          if (type === 'Barang') {
            warehouseData[pIdx].boxes[bIdx].items.push({ id: 'i' + Date.now().toString().slice(-6), itemCode: codeVal, name: nameVal, qty: qtyVal, history: [] }); // Menyiapkan array riwayat
            addLogRecord('TAMBAH BARANG', `Menambahkan ${qtyVal} Pcs ${nameVal}`, `${warehouseData[pIdx].name} > ${warehouseData[pIdx].boxes[bIdx].name}`);
          }
        }
      }
      else if (type === 'Hapus') {
        const reason = document.getElementById('input-reason').value;
        if (!reason) return showToast("Alasan wajib diisi!", "error");
        if (pIdx < 0 || bIdx < 0) return showToast("Lokasi tidak valid!", "error");
        
        const itemIdx = warehouseData[pIdx].boxes[bIdx].items.findIndex(i => i.id === modalState.itemId);
        warehouseData[pIdx].boxes[bIdx].items.splice(itemIdx, 1);
        addLogRecord('HAPUS BARANG', `Menghapus ${modalState.itemData.qty} Pcs ${modalState.itemData.name}. Alasan: ${reason}`, modalState.parentName);
      }
      else if (type === 'Pindah') {
        const tPallet = document.getElementById('select-pallet').value;
        const tBox = document.getElementById('select-box').value;
        const moveQty = parseInt(document.getElementById('input-qty').value);
        if (!tPallet || !tBox || moveQty <= 0 || moveQty > modalState.itemData.qty) return showToast("Pilih tujuan dan jumlah yang valid!", "error");
        if (pIdx < 0 || bIdx < 0) return showToast("Lokasi awal tidak valid!", "error");

        const itemIdx = warehouseData[pIdx].boxes[bIdx].items.findIndex(i => i.id === modalState.itemId);
        if (moveQty === modalState.itemData.qty) warehouseData[pIdx].boxes[bIdx].items.splice(itemIdx, 1);
        else warehouseData[pIdx].boxes[bIdx].items[itemIdx].qty -= moveQty;

        const tpIdx = warehouseData.findIndex(p => p.id === tPallet);
        const tbIdx = warehouseData[tpIdx].boxes.findIndex(b => b.id === tBox);
        const existItem = warehouseData[tpIdx].boxes[tbIdx].items.find(i => i.itemCode === modalState.itemData.itemCode);
        
        if (existItem) existItem.qty += moveQty;
        else warehouseData[tpIdx].boxes[tbIdx].items.push({ ...modalState.itemData, id: 'i'+Date.now().toString().slice(-6), qty: moveQty });

        addLogRecord('PINDAH BARANG', `Memindahkan ${moveQty} Pcs ${modalState.itemData.name}`, `${warehouseData[tpIdx].name} > ${warehouseData[tpIdx].boxes[tbIdx].name}`);
      }

      closeModal();
      navigate('warehouse', true); 
      syncToDatabase(); 
    }

    // --- UPDATE 4: FUNGSI BARU UNTUK PROSES PENYESUAIAN KARTU STOK ---
    window.processItemStockAdjustment = () => {
        const type = document.getElementById('adjust-type').value;
        const qty = parseInt(document.getElementById('adjust-qty').value);
        const reason = document.getElementById('adjust-reason').value.trim();
        
        if (!qty || qty <= 0) return showToast("Jumlah barang tidak valid!", "error");
        if (!reason) return showToast("Alasan mutasi wajib diisi!", "error");

        const pIdx = warehouseData.findIndex(p => p.id === modalState.parentId);
        const bIdx = pIdx >= 0 ? warehouseData[pIdx].boxes.findIndex(b => b.id === modalState.parentBoxId) : -1;
        if (pIdx < 0 || bIdx < 0) return showToast("Lokasi barang tidak valid!", "error");
        
        const itemIdx = warehouseData[pIdx].boxes[bIdx].items.findIndex(i => i.id === modalState.itemId);
        if (itemIdx < 0) return showToast("Barang tidak ditemukan!", "error");

        let targetItem = warehouseData[pIdx].boxes[bIdx].items[itemIdx];
        
        // Proteksi Barang Keluar (Minus) agar tidak minus di bawah nol
        if (type === 'OUT' && qty > targetItem.qty) {
            return showToast("Gagal: Stok tidak mencukupi untuk dikeluarkan!", "error");
        }

        // 1. Eksekusi Perubahan Stok Utama
        if (type === 'IN') targetItem.qty += qty;
        else if (type === 'OUT') targetItem.qty -= qty;

        // 2. Siapkan dan Catat ke Array Kartu Stok (History)
        if (!targetItem.history) targetItem.history = []; // Buat array riwayat jika belum pernah ada
        
        const historyRecord = {
            date: new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
            type: type,
            qty: qty,
            reason: reason,
            user: currentUser ? currentUser.username : 'Admin'
        };
        targetItem.history.push(historyRecord); // Simpan ke catatan tabungan barang

        // 3. Catat juga di Log Aktivitas Global (History Log)
        const actionText = type === 'IN' ? 'STOK MASUK' : 'STOK KELUAR';
        const detailText = `${type === 'IN' ? 'Menambah' : 'Mengurangi'} ${qty} Pcs ${targetItem.name}. Alasan: ${reason}`;
        addLogRecord(actionText, detailText, `${warehouseData[pIdx].name} > ${warehouseData[pIdx].boxes[bIdx].name}`);

        // 4. Update Database
        syncToDatabase();
        showToast("Mutasi stok berhasil dicatat!", "success");
        
        // 5. Muat Ulang Modal secara Instan (Agar tabel riwayat & angka langsung berubah di depan mata Anda)
        openModal('Edit', modalState.parentId, modalState.parentBoxId, null, modalState.itemId);
        
        // 6. Pastikan UI Gudang di latar belakang ikut terupdate
        navigate('warehouse', true);
    };

    async function refreshDatabase() {
      const modal = document.getElementById('modal-container');
      if (modal && !modal.classList.contains('hidden-el')) return;

      setSyncStatus('Menarik Data...', 'bg-blue-500');
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        if(data) {
          currentDbVersion = data.dbVersion || 1; 
          
          warehouseData = data.warehouseData || [];
          historyLog = data.historyLog || [];
          manifestHistory = data.manifestHistory || [];

          setSyncStatus('Sistem Aktif', 'bg-emerald-500');
          if(currentUser) {
             if (activeMenu === 'dashboard') {
                 document.getElementById('main-content').innerHTML = renderDashboard(true);
                 setTimeout(initChart, 100);
             } 
             else if (activeMenu === 'warehouse') {
                 const searchInp = document.getElementById('warehouse-search');
                 const currentSearch = searchInp ? searchInp.value : '';
                 document.getElementById('main-content').innerHTML = renderWarehouse(true);
                 if (currentSearch) {
                     const newSearchInp = document.getElementById('warehouse-search');
                     if(newSearchInp) { newSearchInp.value = currentSearch; filterWarehouse(); }
                 }
             }
             else if (activeMenu === 'history') document.getElementById('main-content').innerHTML = renderHistory(true);
             else if (activeMenu === 'users') {
                 document.getElementById('main-content').innerHTML = renderUsersMenu(true);
                 fetchUsersList();
             }
             lucide.createIcons();
          }
        }
      } catch (err) {
        setSyncStatus('Mode Offline', 'bg-red-500');
      }
    }

    setInterval(() => {
       if (document.visibilityState === 'visible' && currentUser && SCRIPT_URL) {
           refreshDatabase(); 
       }
    }, 30000); 

    document.addEventListener('visibilitychange', () => {
       if (document.visibilityState === 'visible' && currentUser && SCRIPT_URL) {
           refreshDatabase(); 
       }
    });
  </script>
</body>
